<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trend Pick - 最新話題・アニメ・ゲーム・グッズレビュー</title>
  <meta name="description" content="アニメ、ゲーム、ガジェット、グッズの話題を読みやすくまとめるレビューメディア。">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trend Pick">
  <meta property="og:title" content="Trend Pick - 最新話題・アニメ・ゲーム・グッズレビュー">
  <meta property="og:url" content="https://dedicatebabe.github.io/trend-auto-system/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #101820;
      --navy: #0b1d36;
      --paper: #f3f5f8;
      --surface: #ffffff;
      --text: #142033;
      --muted: #5b6b82;
      --line: #d7dee8;
      --accent: #1d4f91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
      color: var(--text);
      background: var(--paper);
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(920px, calc(100% - 2rem)); margin: 0 auto; }
    .site-header {
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(10px);
    }
    .header-inner {
      min-height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 1.2rem; letter-spacing: -0.03em; }
    .brand span { color: var(--accent); }
    .nav { display: flex; gap: 1rem; font-size: 0.86rem; color: var(--muted); font-weight: 500; }
    .hero {
      background: linear-gradient(135deg, #0b1d36 0%, #163056 60%, #1e3c6e 100%);
      color: #fff;
      padding: 2.4rem 0 2.1rem;
    }
    .hero h1 {
      margin: 0 0 0.55rem;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      line-height: 1.35;
      font-weight: 900;
    }
    .hero p { margin: 0; max-width: 36em; color: rgba(255,255,255,.78); font-size: 0.95rem; }
    .main { padding: 1.8rem 0 3.5rem; }
    .section-label {
      margin: 0 0 0.75rem;
      font-family: "Outfit", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }
    .featured {
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.35rem 1.3rem 1.4rem;
      margin-bottom: 1.6rem;
      transition: border-color .15s ease, transform .15s ease;
    }
    .featured:hover { border-color: #9eb0c6; transform: translateY(-1px); }
    .featured.empty { color: var(--muted); }
    .eyebrow {
      display: inline-block;
      margin-bottom: 0.55rem;
      padding: 0.15rem 0.5rem;
      background: var(--ink);
      color: #9fe8cf;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: 2px;
    }
    .featured h2 {
      margin: 0 0 0.55rem;
      font-size: clamp(1.2rem, 2.6vw, 1.55rem);
      line-height: 1.4;
      color: var(--navy);
    }
    .featured p { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.92rem; }
    .read-more { color: var(--accent); font-weight: 700; font-size: 0.9rem; }
    .latest-list { display: grid; gap: 0.7rem; }
    .story-item {
      display: grid;
      gap: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.95rem 1rem;
    }
    .story-item:hover { border-color: #9eb0c6; }
    .story-badge {
      width: fit-content;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .story-item h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.45;
      color: var(--navy);
    }
    .story-item p { margin: 0; color: var(--muted); font-size: 0.84rem; }
    .story-date { color: #8090a4; font-size: 0.75rem; }
    .muted { color: var(--muted); }
    .note {
      margin-top: 1.6rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
    }
    .site-footer {
      background: var(--navy);
      color: rgba(255,255,255,.75);
      font-size: 0.8rem;
    }
    .footer-inner { padding: 1.5rem 0; display: grid; gap: 0.25rem; }
    .footer-inner strong { color: #fff; font-family: "Outfit", sans-serif; }
    .footer-inner a { color: #cfe0f5; text-decoration: underline; }
    @media (max-width: 640px) {
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">Trend <span>Pick</span></a>
      <nav class="nav">
        <a href="#latest">最新</a>
        <a href="affiliate.html">アフィリエイト表記</a>
        <a href="privacy.html">プライバシー</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Trend Pick</h1>
      <p>アニメ・ゲーム・ガジェット・グッズの話題を、読み物としてまとめるメディアです。商品を探す記事では相場比較リンクも案内します。</p>
    </div>
  </section>

  <main class="main wrap">
    <p class="section-label">FEATURED</p>
    {{FEATURED_BLOCK}}

    <p class="section-label" id="latest">LATEST</p>
    <div class="latest-list">
      {{LATEST_LIST}}
    </div>

    <p class="note">当サイトはアフィリエイトプログラムに参加しています。商品リンクがある記事では、リンク経由の購入で紹介料を受け取ることがあります。アダルトコンテンツは扱いません。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <strong>Trend Pick</strong>
      <div><a href="affiliate.html">アフィリエイト表記</a> / <a href="privacy.html">プライバシー</a></div>
      <div>&copy; {{YEAR}} Trend Pick</div>
    </div>
  </footer>
</body>
</html>
