<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} | Trend Pick</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Trend Pick">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  {{OG_IMAGE_TAG}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap-narrow header-inner">
      <a class="brand" href="index.html">Trend <span>Pick</span></a>
      <a class="nav" href="index.html" style="color:var(--muted);">記事一覧</a>
    </div>
  </header>

  <main class="article-main wrap-narrow">
    <p class="aff-note">※本ページはアフィリエイト広告を利用しています</p>

    <article class="article">
      <div class="badge-row">
        <span class="badge {{BADGE_CLASS}}">{{BADGE}}</span>
        {{STATUS_BADGE}}
      </div>
      <h1>{{PAGE_TITLE}}</h1>
      <p class="meta">{{PUBLISH_DATE}}</p>

      {{PRODUCT_IMAGE}}

      <div class="content">
        {{ARTICLE_BODY}}
      </div>

      {{SHOP_LINKS}}
    </article>

    <a class="back" href="index.html">← トップへ戻る</a>
  </main>

  <footer class="site-footer">
    <div class="wrap-narrow footer-inner">
      <div>一部の記事にはショップへのリンクが含まれることがあります。アダルトコンテンツは扱いません。</div>
      <div><a href="affiliate.html">アフィリエイト表記</a> / <a href="privacy.html">プライバシー</a></div>
      <div>&copy; {{YEAR}} Trend Pick</div>
    </div>
  </footer>
</body>
</html>
