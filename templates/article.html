Summary: 余白圧縮版を取り消し、直前の記事テンプレに戻す
========================================== -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} | Trend Pick</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Trend Pick">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  {{OG_IMAGE_TAG}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0e1116;
      --paper: #eef1f4;
      --surface: #ffffff;
      --text: #12161c;
      --muted: #5a6573;
      --line: #d4dae3;
      --mint: #2fe0b4;
      --mercari: #ff333f;
      --surugaya: #101820;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f7f8fa 0%, var(--paper) 100%);
      line-height: 1.8;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .wrap {
      width: min(820px, calc(100% - 2rem));
      margin: 0 auto;
    }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(14, 17, 22, 0.94);
      color: #fff;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }
    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .brand em {
      font-style: normal;
      color: var(--mint);
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
      font-weight: 500;
    }
    .nav-link:hover { color: var(--mint); }
    .main { padding: 1.6rem 0 4.2rem; }
    .article-shell {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .hero-media {
      background:
        radial-gradient(circle at 70% 30%, rgba(47, 224, 180, 0.28), transparent 45%),
        linear-gradient(145deg, #101820, #0a0e13);
    }
    .hero-media img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
    }
    .article-body { padding: 1.55rem 1.4rem 2rem; }
    .badge {
      display: inline-block;
      margin: 0 0 0.75rem;
      padding: 0.18rem 0.5rem;
      background: var(--ink);
      color: var(--mint);
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 2px;
    }
    h1 {
      margin: 0 0 0.65rem;
      color: var(--ink);
      font-size: clamp(1.4rem, 3vw, 1.95rem);
      line-height: 1.4;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    .meta {
      margin: 0 0 1.2rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-family: "Space Grotesk", sans-serif;
    }
    .teaser {
      margin: 0 0 1.4rem;
      padding: 1rem 1.05rem;
      border-left: 3px solid var(--mint);
      background: #f2f6f5;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .content h2 {
      margin: 2rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--ink);
      color: var(--ink);
      font-size: 1.12rem;
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.02em;
    }
    .content p { margin: 0.8rem 0; }
    .content ul {
      margin: 0.8rem 0 1.1rem;
      padding: 1rem 1rem 1rem 1.45rem;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .content li { margin: 0.35rem 0; }
    .cta-panel {
      margin-top: 2.1rem;
      padding: 1.25rem;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, #f7faf9, #eef3f2);
      text-align: center;
    }
    .cta-panel p {
      margin: 0 0 0.95rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: 0.04em;
    }
    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0.85rem 1rem;
      border-radius: 4px;
      color: #fff !important;
      font-size: 0.95rem;
      font-weight: 700;
      transition: transform 0.2s ease;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta-mercari { background: var(--mercari); }
    .cta-surugaya { background: var(--surugaya); }
    .back {
      display: inline-block;
      margin-top: 1.35rem;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 700;
      border-bottom: 2px solid var(--mint);
    }
    .site-footer {
      background: var(--ink);
      color: rgba(255, 255, 255, 0.72);
    }
    .footer-inner {
      padding: 2rem 0;
      display: grid;
      gap: 0.35rem;
      font-size: 0.82rem;
    }
    .footer-inner strong {
      color: #fff;
      font-family: "Space Grotesk", sans-serif;
    }
    .footer-inner strong span { color: var(--mint); }
    @media (max-width: 640px) {
      .article-body { padding: 1.15rem 1rem 1.5rem; }
      .cta-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">TREND<em>PICK</em></a>
      <a class="nav-link" href="index.html">記事一覧</a>
    </div>
  </header>

  <main class="main wrap">
    <article class="article-shell">
      {{HERO_BLOCK}}
      <div class="article-body">
        <span class="badge">{{CATEGORY}}</span>
        <h1>{{PAGE_TITLE}}</h1>
        <p class="meta">{{PUBLISH_DATE}}</p>
        <p class="teaser">気になったアイテムは、メルカリと駿河屋から状態や価格を比較できます。一般向けの公式グッズ・書籍・ゲーム・ガジェットのみを案内しています。</p>
        <div class="content">
          {{ARTICLE_BODY}}
        </div>
        <div class="cta-panel">
          <p>CHECK STOCK &amp; PRICE</p>
          <div class="cta-row">
            <a class="cta cta-mercari" href="{{MERCARI_URL}}" rel="nofollow sponsored noopener" target="_blank">メルカリで探す</a>
            <a class="cta cta-surugaya" href="{{SURUGAYA_URL}}" rel="nofollow sponsored noopener" target="_blank">駿河屋で探す</a>
          </div>
        </div>
        <a class="back" href="index.html">最新記事一覧へ戻る</a>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <strong>TREND<span>PICK</span></strong>
      <div>当ページはアフィリエイト広告を含みます。アダルトコンテンツは扱いません。</div>
      <div>&copy; {{YEAR}} Trend Pick</div>
    </div>
  </footer>
</body>
</html>
