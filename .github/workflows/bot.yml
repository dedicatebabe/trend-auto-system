name: Trend Pick Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py (記事のみ / Xはローカル)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MERCARI_AFID: ${{ secrets.MERCARI_AFID }}
          SURUGAYA_USER_ID: ${{ secrets.SURUGAYA_USER_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          RAKUTEN_AF_ID: ${{ secrets.RAKUTEN_AF_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          X_POST_METHOD: browser
        run: python main.py --per-source 5 --pool 20 --skip-x

      - name: Commit and push docs and posted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ posted.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update affiliate product articles"
          git push
